[project]
name = "tablescribe"
version = "0.1.0"
description = "Local in-room meeting assistant: live ASR with speakers, notes, fact-checks, minutes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "mlx-audio>=0.5.9",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["app"]
